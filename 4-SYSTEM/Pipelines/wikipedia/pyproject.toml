[project]
name = "kangyur-wiki"
version = "0.1.0"
description = "Semi-automatic pipeline for generating cited Tibetan Wikipedia articles from Kangyur/Tengyur root texts and their commentaries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tashi Tsering", email = "openpecha@gmail.com" }]

dependencies = [
    "requests>=2.31",
    "google-genai>=2.0",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
tibetan = ["botok>=0.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
kwiki = "kangyur_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kangyur_wiki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
