# Publication registry for the tara21 slot-article track.
#
# CANONICAL. Check this file before publishing anything: a slot that already has a
# `pageid` is live and must be UPDATED at that title, never created again. A title
# listed under `planned` is reserved for that slot — do not publish a different slot
# under it.
#
# Each published slot's own article.md frontmatter carries the same wiki_title /
# wiki_pageid / wiki_url; this file is the cross-slot view. Keep them in sync.
#
# Review view: PUBLISHED.md (regenerate it from here, do not edit it by hand).
version: 1
corpus_id: tara21
site: bo.wikipedia.org
namespace: mainspace
updated: '2026-08-21'

title_convention:
  slot_articles: >-
    A Tārā slot article is titled with the deity's epithet prefixed by སྒྲོལ་མ་ —
    སྒྲོལ་མ་<epithet>། — so that the 21 titles form one visibly consistent series and
    each reads as the name of a deity rather than as a line of the praise. Established
    by the first three published (tara-01/02/03).
  non_slot_articles: >-
    Subject articles (origin, structure-benefits) take a plain descriptive Tibetan
    title; the སྒྲོལ་མ་ prefix rule does not apply to them.
  epithet_source: >-
    The epithet must be one attested in the commentaries and named in the article's own
    མཚན་གྱི་ངེས་ཚིག section — never invented, never taken from parametric knowledge.
    Where the commentaries disagree on the name (they do for most slots), the choice
    among attested candidates is a human editorial decision, recorded per slot below.
  lead_term_caveat: >-
    The title is NOT auto-derivable from the article's first bolded term. In most slot
    articles that term is the opening line of the root verse (ཕྱག་འཚལ་…), not a name;
    in tara-02 the published title adds the སྒྲོལ་མ་ prefix the source file lacks. Any
    tooling that derives a title from the lead bold term must read this file instead.

