# Publication registry for the tara21 slot-article track.
#
# CANONICAL. Check this file before publishing anything: a slot that already has a
# `pageid` is live and must be UPDATED at that title, never created again. A title
# listed under `planned` is reserved for that slot — do not publish a different slot
# under it. The same applies to `term_articles`: a term already carrying a `pageid`
# is live and must be updated at that title, not republished.
#
# Each published slot's own article.md frontmatter carries the same wiki_title /
# wiki_pageid / wiki_url; this file is the cross-slot view. Keep them in sync. Same
# for published term articles (term-articles/<term>/article.md).
#
# All 21 slot titles are settled as of 2026-08-21 — see title_convention.selection_rule
# for how contested epithets were decided, and each slot's `decision_basis`. All 21
# slots (plus the 2 subject articles) are now live as of 2026-08-23.
#
# Review view: PUBLISHED.md (regenerate it from here, do not edit it by hand).
version: 1
corpus_id: tara21
site: bo.wikipedia.org
namespace: mainspace
updated: '2026-08-23'
title_convention:
  slot_articles: A Tārā slot article is titled with the deity's epithet prefixed by སྒྲོལ་མ་ — སྒྲོལ་མ་<epithet>།
    — so that the 21 titles form one visibly consistent series and each reads as the name of a deity rather
    than as a line of the praise. Established by the first three published (tara-01/02/03).
  non_slot_articles: Subject articles (origin, structure-benefits) take a plain descriptive Tibetan title;
    the སྒྲོལ་མ་ prefix rule does not apply to them.
  epithet_source: The epithet must be one attested in the commentaries and named in the article's own
    མཚན་གྱི་ངེས་ཚིག section — never invented, never taken from parametric knowledge. Where the commentaries
    disagree on the name (they do for most slots), the choice among attested candidates is a human editorial
    decision, recorded per slot below.
  lead_term_caveat: The title is NOT auto-derivable from the article's first bolded term. In most slot
    articles that term is the opening line of the root verse (ཕྱག་འཚལ་…), not a name; in tara-02 the published
    title adds the སྒྲོལ་མ་ prefix the source file lacks. Any tooling that derives a title from the lead
    bold term must read this file instead.
  series_prefix: 'Every one of the 21 slot articles is titled སྒྲོལ་མ་<epithet>། — the prefix goes at
    the front without exception, so the whole series sorts and prefix-searches together on the wiki. Where
    the attested epithet is itself of the form X་གྱི་སྒྲོལ་མ, it is normalised to སྒྲོལ་མ་X། — the move
    already used live for tara-03 (གསེར་མདོག་ཅན་གྱི་སྒྲོལ་མ → སྒྲོལ་མ་གསེར་མདོག་ཅན།). Honorifics (རྗེ་བཙུན་མ་,
    རྗེ་བཙུན་) and any ལྷ་མོ་ element are stripped. Nothing is ever added: no syllable appears in a title
    that is not in the attested epithet.'
  selection_rule: 'Where the commentaries name a slot differently — they do for most of them — the epithet
    is chosen by, in order: (1) widest attestation, the name given by the most commentaries; (2) on a
    tie, the name the article''s own lead sentence or root verse already carries, so that title and article
    agree; (3) still tied, the form that reads as a name rather than as a description of the deity''s
    activity, preferring the shorter and the ...མ ending the series uses. Every chosen epithet was checked
    to appear verbatim in its own article before being used. Recorded per slot as `decision_basis`; the
    rejected candidates are kept below so the choice stays auditable and the divergence itself is never
    lost — it remains documented in each article''s མཚན་གྱི་ངེས་ཚིག section, which the title does not
    overwrite.'
  lead_term_sync: Each article's opening bolded term is kept identical to its title (minus the final shad,
    plus a tsheg inside the bold, per the live tara-01 form '''སྒྲོལ་མ་མྱུར་མ་དཔའ་མོ་'''ནི་). Updated
    for all 18 unpublished slots on 2026-08-21. tara-02 is the one live article where the two still differ.
