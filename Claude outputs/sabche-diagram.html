<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sabche</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: #ffffff;
    color: #111111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181d; color: #e8e8e8; }
  }
  figure { margin: 0; max-width: 900px; width: 100%; }
  svg { width: 100%; height: auto; display: block; }
  figcaption {
    margin-top: 14px;
    font-size: 13.5px;
    line-height: 1.5;
    color: inherit;
    opacity: 0.75;
  }
  text { font-family: inherit; }
</style>
</head>
<body>
<figure>
  <svg viewBox="0 0 900 570" role="img" aria-label="A flat sequence of eight verses read straight through, compared with the same text cut by a sa bcad outline into nested sections and sub-sections down to individual verses.">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <polygon points="0,0 10,5 0,10" fill="currentColor"/>
      </marker>
    </defs>

    <!-- ===== Panel 1: linear reading ===== -->
    <text x="30" y="24" font-size="13" font-weight="600">Reading straight through, verse by verse</text>

    <g font-size="11.5" text-anchor="middle">
      <!-- boxes -->
      <g fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="30"  y="42" width="80" height="34" rx="4"/>
        <rect x="130" y="42" width="80" height="34" rx="4"/>
        <rect x="230" y="42" width="80" height="34" rx="4"/>
        <rect x="330" y="42" width="80" height="34" rx="4"/>
        <rect x="430" y="42" width="80" height="34" rx="4"/>
        <rect x="530" y="42" width="80" height="34" rx="4"/>
        <rect x="630" y="42" width="80" height="34" rx="4"/>
        <rect x="730" y="42" width="140" height="34" rx="4"/>
      </g>
      <text x="70"  y="63">Homage</text>
      <text x="170" y="63">v.1</text>
      <text x="270" y="63">v.2</text>
      <text x="370" y="63">v.3</text>
      <text x="470" y="63">v.4</text>
      <text x="570" y="63">v.5</text>
      <text x="670" y="63">v.6</text>
      <text x="800" y="63">Dedication</text>

      <!-- connecting arrows -->
      <g stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)">
        <line x1="110" y1="59" x2="128" y2="59"/>
        <line x1="210" y1="59" x2="228" y2="59"/>
        <line x1="310" y1="59" x2="328" y2="59"/>
        <line x1="410" y1="59" x2="428" y2="59"/>
        <line x1="510" y1="59" x2="528" y2="59"/>
        <line x1="610" y1="59" x2="628" y2="59"/>
        <line x1="710" y1="59" x2="728" y2="59"/>
      </g>
    </g>

    <text x="30" y="104" font-size="11" opacity="0.65">One thing after another — no sense of which verses belong together, or which parts are minor vs. major.</text>

    <!-- divider -->
    <line x1="30" y1="128" x2="870" y2="128" stroke="currentColor" stroke-width="0.75" opacity="0.35" stroke-dasharray="3 4"/>

    <!-- ===== Panel 2: sa bcad tree ===== -->
    <text x="30" y="154" font-size="13" font-weight="600">Sa bcad — the same text, cut at its structural joints</text>

    <g font-size="11.5" text-anchor="middle">
      <!-- edges: root to level 1 -->
      <g stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)">
        <line x1="450" y1="196" x2="180" y2="234"/>
        <line x1="450" y1="196" x2="450" y2="234"/>
        <line x1="450" y1="196" x2="720" y2="234"/>
      </g>

      <!-- root -->
      <rect x="390" y="172" width="120" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="450" y="192">Root Text</text>

      <!-- level 1 -->
      <rect x="120" y="240" width="120" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="180" y="260">A. Homage</text>

      <rect x="390" y="240" width="120" height="30" rx="4" fill="none" stroke="#3b7dd8" stroke-width="1.5"/>
      <text x="450" y="260" fill="#3b7dd8">B. Main Body</text>

      <rect x="660" y="240" width="120" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <text x="720" y="260">C. Dedication</text>

      <!-- edges: A -> its verse ; C -> its verse -->
      <g stroke="currentColor" stroke-width="1.1" marker-end="url(#arrow)">
        <line x1="180" y1="270" x2="180" y2="322"/>
        <line x1="720" y1="270" x2="720" y2="322"/>
      </g>
      <rect x="130" y="328" width="100" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <text x="180" y="347" font-size="11">Homage verse</text>
      <rect x="670" y="328" width="100" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <text x="720" y="347" font-size="11">Dedication verse</text>

      <!-- edges: B -> B1,B2,B3 -->
      <g stroke="#3b7dd8" stroke-width="1.2" marker-end="url(#arrow)">
        <line x1="450" y1="270" x2="330" y2="322"/>
        <line x1="450" y1="270" x2="450" y2="322"/>
        <line x1="450" y1="270" x2="570" y2="322"/>
      </g>

      <rect x="270" y="328" width="120" height="30" rx="4" fill="none" stroke="#3b7dd8" stroke-width="1.3"/>
      <text x="330" y="348" font-size="10.5" fill="#3b7dd8">B1. Body qualities</text>

      <rect x="390" y="328" width="120" height="30" rx="4" fill="none" stroke="#3b7dd8" stroke-width="1.3"/>
      <text x="450" y="348" font-size="10.5" fill="#3b7dd8">B2. Speech qualities</text>

      <rect x="510" y="328" width="120" height="30" rx="4" fill="none" stroke="#3b7dd8" stroke-width="1.3"/>
      <text x="570" y="348" font-size="10.5" fill="#3b7dd8">B3. Mind qualities</text>

      <!-- edges: B1,B2,B3 -> verse leaves -->
      <g stroke="currentColor" stroke-width="1" marker-end="url(#arrow)">
        <line x1="305" y1="358" x2="290" y2="400"/>
        <line x1="355" y1="358" x2="370" y2="400"/>
        <line x1="425" y1="358" x2="410" y2="400"/>
        <line x1="475" y1="358" x2="490" y2="400"/>
        <line x1="545" y1="358" x2="530" y2="400"/>
        <line x1="595" y1="358" x2="610" y2="400"/>
      </g>

      <g fill="none" stroke="currentColor" stroke-width="1">
        <rect x="260" y="406" width="60" height="26" rx="4"/>
        <rect x="340" y="406" width="60" height="26" rx="4"/>
        <rect x="380" y="406" width="60" height="26" rx="4"/>
        <rect x="460" y="406" width="60" height="26" rx="4"/>
        <rect x="500" y="406" width="60" height="26" rx="4"/>
        <rect x="580" y="406" width="60" height="26" rx="4"/>
      </g>
      <g font-size="11">
        <text x="290" y="423">v.1</text>
        <text x="370" y="423">v.2</text>
        <text x="410" y="423">v.3</text>
        <text x="490" y="423">v.4</text>
        <text x="530" y="423">v.5</text>
        <text x="610" y="423">v.6</text>
      </g>
    </g>

    <text x="30" y="470" font-size="11" opacity="0.65">Same eight verses as above — now grouped under headings that show what each part is doing, and how deep it goes.</text>
    <text x="30" y="490" font-size="11" opacity="0.65">Some sections (Homage, Dedication) are a single verse and stop there; the Main Body keeps dividing until it bottoms out at individual verses.</text>
  </svg>
  <figcaption>
    A sa bcad ("ground-cutting") doesn't add or change any words — it takes the same linear text and labels the joints in its argument, so a reader can see which verses belong together and how minor a given verse is to the whole, instead of just reading start to finish. (Section labels here are a generic illustration, not the actual outline of any specific text.)
  </figcaption>
</figure>
</body>
</html>
