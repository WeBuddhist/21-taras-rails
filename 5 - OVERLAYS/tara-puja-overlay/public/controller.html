<!doctype html>
<meta charset="utf-8">
<title>Puja Controller</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14100c; --card: #1f1811; --line: #37291c;
    --ink: #f3ead9; --ink-soft: #b09a80; --accent: #c9622f; --gold: #b98a3e;
    --sans: "Inter", system-ui, sans-serif; --serif: "Cormorant Garamond", Georgia, serif;
  }
  @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap");
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* Left: sequence list */
  aside { border-right: 1px solid var(--line); overflow-y: auto; padding: 16px 12px; }
  aside h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 4px 8px 14px; color: var(--gold); }
  .step { padding: 9px 12px; border-radius: 7px; cursor: pointer; font-size: 15px;
          color: var(--ink-soft); display: flex; gap: 9px; align-items: baseline; }
  .step:hover { background: #241b13; }
  .step.active { background: var(--accent); color: #fff; }
  .step .n { font-variant-numeric: tabular-nums; opacity: .7; min-width: 22px; }
  .step.section-row { color: var(--ink); font-weight: 600; margin-top: 6px; }
  .step.section-row .n { opacity: 0; }

  /* Right: now-showing + controls */
  main { padding: 34px 40px; display: flex; flex-direction: column; }
  .status { font-size: 14px; color: var(--ink-soft); letter-spacing: .04em; }
  .status b { color: var(--gold); font-weight: 600; }
  .now { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 760px; }
  .now .kicker { color: var(--accent); font-size: 16px; font-weight: 600; margin-bottom: 8px; min-height: 20px; }
  .now .title { font-family: var(--sans); font-weight: 600; font-size: 28px; line-height: 1.3; margin-bottom: 8px; }
  .now .sub { color: var(--ink-soft); font-size: 20px; font-style: italic; margin-bottom: 22px; min-height: 24px; }
  .now .body { font-family: var(--serif); font-size: 26px; line-height: 1.45; color: var(--ink); }
  .now .round { display: inline-block; margin-top: 20px; padding: 5px 14px; border: 1px solid var(--gold);
                border-radius: 20px; color: var(--gold); font-family: var(--sans); font-size: 14px; }

  .controls { display: flex; align-items: center; gap: 14px; padding-top: 22px; border-top: 1px solid var(--line); }
  button { font-family: var(--sans); font-size: 16px; font-weight: 600; border: 0; border-radius: 9px;
           padding: 14px 26px; cursor: pointer; }
  .prev { background: #2a2016; color: var(--ink); }
  .next { background: var(--accent); color: #fff; flex: none; }
  .next:hover { background: #d9713c; }
  .prev:hover { background: #352819; }
  .hint { color: var(--ink-soft); font-size: 13px; margin-left: auto; }
  .conn-pill { font-size: 13px; padding: 4px 10px; border-radius: 20px; font-weight: 600; }
  .conn-pill.ok { background: #1f3a24; color: #7fd598; }
  .conn-pill.bad { background: #3a1f1f; color: #e08585; }
</style>

<aside>
  <h2>Sequence</h2>
  <div id="list"></div>
</aside>

<main>
  <div class="status">
    Language overlays follow this controller.
    <span id="conn" class="conn-pill bad">connecting…</span>
  </div>
  <div class="now">
    <div class="kicker" id="kicker"></div>
    <div class="title" id="title"></div>
    <div class="sub" id="sub"></div>
    <div class="body" id="body"></div>
    <div class="round" id="round" style="display:none"></div>
  </div>
  <div class="controls">
    <button class="prev" id="prevBtn">← Previous</button>
    <button class="next" id="nextBtn">Next →</button>
    <span class="hint">← / → or Space to advance</span>
  </div>
</main>

<script src="sequence.js"></script>
<script>
  const el = (id) => document.getElementById(id);
  let SEQ = null, index = 0, pass = 1, ws = null;

  function inLoop(i) { return i >= SEQ.loopStart && i <= SEQ.loopEnd; }

  function send() {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "set", index, pass }));
    paint();
  }

  function next() {
    // If leaving the last Tara: loop back for another round rather than exiting.
    if (inLoop(index) && index === SEQ.loopEnd) {
      // advance one more round automatically? No — operator chooses.
      // Default behaviour: go to next step (Dedication). To repeat, use "Repeat round".
    }
    if (index < SEQ.steps.length - 1) { index++; if (inLoop(index) && !inLoopPrev()) pass = pass; }
    // reset pass when we enter the loop fresh from before it
    if (inLoop(index) && !wasInLoop) pass = 1;
    send();
  }
  let wasInLoop = false, prevIndex = 0;
  function inLoopPrev() { return prevIndex >= SEQ.loopStart && prevIndex <= SEQ.loopEnd; }

  function step(dir) {
    prevIndex = index; wasInLoop = inLoop(index);
    if (dir > 0) {
      if (index < SEQ.steps.length - 1) index++;
      if (inLoop(index) && !wasInLoop) pass = 1;   // entering loop → round 1
    } else {
      if (index > 0) index--;
    }
    send();
  }

  function repeatRound() {
    // Jump back to the first Tara and increment the round counter.
    pass++; index = SEQ.loopStart; send();
  }

  function jump(i) {
    prevIndex = index;
    index = i;
    if (inLoop(index) && !inLoop(prevIndex)) pass = 1;
    send();
  }

  function buildList() {
    const list = el("list");
    SEQ.steps.forEach((s, i) => {
      const div = document.createElement("div");
      div.className = "step" + (s.type === "section" ? " section-row" : "");
      div.dataset.i = i;
      let n = s.number ? s.number : "";
      let name = s.type === "section" ? (s.title.en || s.id)
               : (s.label ? (s.label.en) : (s.names ? s.names.en : s.id));
      div.innerHTML = `<span class="n">${n}</span><span>${name}</span>`;
      div.onclick = () => jump(i);
      list.appendChild(div);
    });
    // Insert a "Repeat round" affordance after the last Tara
    const repeatBtn = document.createElement("div");
    repeatBtn.className = "step";
    repeatBtn.style.cssText = "color:var(--gold);border:1px dashed var(--gold);margin-top:8px;justify-content:center";
    repeatBtn.textContent = "↻ Repeat the 21 (next round)";
    repeatBtn.onclick = repeatRound;
    list.appendChild(repeatBtn);
  }

  function paint() {
    document.querySelectorAll(".step").forEach((d) => {
      d.classList.toggle("active", +d.dataset.i === index);
    });
    const s = SEQ.steps[index];
    if (!s) return;
    if (s.type === "section") {
      el("kicker").textContent = "";
      el("title").textContent = s.title.en || "";
      el("sub").textContent = ""; el("body").innerHTML = "";
      el("round").style.display = "none";
    } else {
      el("kicker").textContent = s.number ? `Praise ${s.number}` : (s.label ? s.label.en : "");
      const chant = (s.translit_full && s.translit_full.length) ? s.translit_full : (s.translit ? [s.translit] : []);
      el("title").innerHTML = chant.map((l) => `<div>${l}</div>`).join("");
      const sub = [s.names && s.names.sanskrit, s.names && s.names.en].filter(Boolean).join("  ·  ");
      el("sub").textContent = sub;
      const en = (s.meaning && s.meaning.en) || [];
      const uchen = (s.uchen || "").split("\n").filter(Boolean);
      el("body").innerHTML =
        (uchen.length ? `<div style="font-size:22px;line-height:1.6;margin-bottom:10px;color:var(--gold)">${uchen.map(l=>`<div>${l}</div>`).join("")}</div>` : "") +
        en.map((l) => `<div>${l}</div>`).join("");
      if (inLoop(index)) { el("round").style.display = "inline-block"; el("round").textContent = "Round " + pass; }
      else el("round").style.display = "none";
    }
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}`);
    ws.onopen = () => { el("conn").className = "conn-pill ok"; el("conn").textContent = "connected"; send(); };
    ws.onclose = () => { el("conn").className = "conn-pill bad"; el("conn").textContent = "reconnecting…"; setTimeout(connect, 1500); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === "state") { index = m.index; pass = m.pass; paint(); }
    };
  }

  el("nextBtn").onclick = () => step(1);
  el("prevBtn").onclick = () => step(-1);
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); step(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    if (e.key === "r") repeatRound();
  });

  loadSequence().then((seq) => { SEQ = seq; buildList(); paint(); connect(); });
</script>
